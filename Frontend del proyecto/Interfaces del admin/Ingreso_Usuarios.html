<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso de Usuarios a Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .navbar { background-color: #1e2640; }
        .acp { background-color: #1e2640; }
        .table-custom { background-color: white; }
        .table-custom thead { background-color: #e9ecef; }
        .table-custom th, .table-custom td { vertical-align: middle; text-align: center; padding: 12px 8px; }
        main { margin-top: 160px; }
        .search-container { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .sin-estilo { text-decoration: none; color: inherit;}
        body { overflow-x: hidden; }
        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .table { width: 100%; max-width: 100%; margin-bottom: 1rem; table-layout: auto; }
        .table th, .table td { white-space: nowrap; }
        .btn-qr { background-color: #28a745; color: white; border: none; padding: 10px 15px; }
        .btn-qr:hover { background-color: #218838; color: white; }
        .btn-excel { background-color: #1d6f42; color: white; border: none; padding: 10px 15px; }
        .btn-excel:hover { background-color: #0e5a2f; color: white; }
        @media (max-width: 1200px) { .table th, .table td { padding: 8px 5px; font-size: 0.9rem; } }
        @media (max-width: 992px) { .table th, .table td { padding: 6px 4px; font-size: 0.85rem; } .btn-qr, .btn-excel { padding: 8px 12px; font-size: 0.9rem; } }
    </style>
</head>
<body class="bg-light">
    <header>
        <nav class="navbar navbar-expand-lg shadow fixed-top" style="background-color: #1e2640;">
             <div class="container-fluid">
               <a class="navbar-brand" href="#">
                 <img src="../Img/IUB logo 2.png" alt="Logo" height="40">
               </a>
               <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                 <span class="navbar-toggler-icon" style="background-color: white;"></span>
               </button>
               <div class="collapse navbar-collapse" id="navbarSupportedContent">
                 <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                   <li class="nav-item"><a class="nav-link text-white" href="../Interfaces del admin/Inicio.html">Inicio</a></li>
                   <li class="nav-item"><a class="nav-link text-white" href="../Interfaces del admin/Registro_Usuario.html">Registros</a></li>
                   <li class="nav-item"><a class="nav-link text-white" href="../Interfaces del admin/Dispositivos.html">Préstamo de dispositivos</a></li>
                   <li class="nav-item"><a class="nav-link text-white active" aria-current="page" href="../Interfaces del admin/Ingreso_Usuarios.html">Ingreso de usuarios</a></li>
                   <li class="nav-item"><a class="nav-link text-white" href="../Interfaces del admin/agregar_estudiante.html">Agregar Usuario</a></li>
                   <!-- ✅ MEJORA: enlace al Dashboard -->
                   <li class="nav-item"><a class="nav-link text-white" href="../Interfaces del admin/estadisticas.html"><i class="bi bi-bar-chart-fill"></i> Dashboard</a></li>
                   <li class="nav-item"><a class="nav-link text-white" href="../manual/ManualUsuario.pdf" target="_blank"><i class="bi bi-question-circle"></i> Ayuda</a></li>
                   <li class="nav-item dropdown">
                    <a class="nav-link text-white" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                      <i class="bi bi-person-circle fs-3 text-white ms-1 me-3"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                      <li><a class="dropdown-item" href="#" onclick="cerrarSesion()">Cerrar Sesión</a></li>
                    </ul>
                  </li>
                 </ul>
               </div>
             </div>
           </nav>
    </header>

    <main class="mb-5">
        <h1 class="mt-1 mb-3 ms-5">Registro de Ingresos a Biblioteca</h1>

        <!-- ✅ MEJORA: buscador en tiempo real -->
        <div class="ms-5 me-5 mb-3">
            <input type="text"
                   id="buscadorIngresos"
                   class="form-control"
                   placeholder="🔍 Buscar por nombre, identificación o estado..."
                   data-tabla="accessLogTableBody">
        </div>

        <div class="d-flex justify-content-end mb-3 me-5 gap-2 flex-wrap">
            <button id="btnActivarLector" class="btn btn-qr">
                <i class="bi bi-qr-code-scan"></i> Activar Lector QR
            </button>
            <!-- ✅ MEJORA: exportar a Excel (reemplaza el botón anterior) -->
            <button onclick="exportarIngresos(currentAccessLogs, 'excel')" class="btn btn-excel">
                <i class="bi bi-file-earmark-excel"></i> Exportar Excel
            </button>
            <!-- ✅ MEJORA: exportar a PDF -->
            <button onclick="exportarIngresos(currentAccessLogs, 'pdf')" class="btn btn-danger">
                <i class="bi bi-file-earmark-pdf"></i> Exportar PDF
            </button>
        </div>

        <div class="table-responsive ms-5 me-5 rounded">
            <div class="rounded shadow">
                <table class="table mb-0 table-secondary text-center align-middle">
                    <thead>
                        <tr>
                            <th scope="col">ID Acceso</th>
                            <th scope="col">Identificación Usuario</th>
                            <th scope="col">Nombre Usuario</th>
                            <th scope="col">Fecha y Hora</th>
                            <th scope="col">Mensaje</th>
                            <th scope="col">Estado</th>
                        </tr>
                    </thead>
                    <tbody class="table-light" id="accessLogTableBody">
                        <tr><td colspan="6">Cargando registros...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- ✅ MEJORA: librerías para exportar PDF y Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- ✅ MEJORA: sesion.js antes que los demás para cierre automático por inactividad -->
    <script src="../js/sesion.js"></script>
    <script src="../js/confirmacion.js"></script>
    <script src="../js/buscador.js"></script>
    <script src="../js/reportes.js"></script>
    <script src="../js/Ingreso_Usuarios.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prestamos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/Inicio.css">
    <link rel="stylesheet" href="../css/estilo.css">
    <style>
        .navbar {
            background-color: #1e2640;
        }

        .acp {
            background-color: #1e2640;
        }

        .table-custom {
            background-color: white;
        }

        .table-custom thead {
            background-color: #e9ecef;
        }

        .table-custom th,
        .table-custom td {
            vertical-align: middle;
            text-align: center;
            padding: 12px 8px;
        }

        main {
            margin-top: 160px;
        }

        .filtros-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-filtro {
            background-color: #e9ecef;
            border: 1px solid #ced4da;
            color: #495057;
            padding: 6px 12px;
            font-size: 14px;
        }

        .btn-filtro:hover {
            background-color: #d1d7dc;
        }

        .search-container {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .dropdown-menu {
            max-height: 300px;
            overflow-y: auto;
        }

        .dropdown-item-checkbox {
            padding: 0.25rem 1.5rem;
        }

        .dropdown-item-checkbox label {
            cursor: pointer;
            width: 100%;
            padding: 0.25rem 0;
            margin: 0;
        }

        .sin-estilo {
            text-decoration: none;
        }

        body {
            overflow-x: hidden;
        }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .table {
            width: 100%;
            max-width: 100%;
            margin-bottom: 1rem;
            table-layout: auto;
        }

        .table th,
        .table td {
            white-space: nowrap;
        }

        @media (max-width: 1200px) {

            .table th,
            .table td {
                padding: 8px 5px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 992px) {

            .table th,
            .table td {
                padding: 6px 4px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body class="bg-light">
    <header>
        <nav class="navbar navbar-expand-lg shadow fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="../Img/IUB logo 2.png" alt="Logo" height="40">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../Interfaces del admin/Inicio.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../Interfaces del admin/Libross.html">Libros</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../Interfaces del admin/Registro_Usuario.html">Registros</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../Interfaces del admin/Prestamos.html">Prestamos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../Interfaces del admin/Ingreso_Usuarios.html">Ingreso de usuarios</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../Interfaces del admin/agregar_estudiante.html">Agregar Usuario</a>
                        </li>
                        <li class="nav-item">
  <a class="nav-link text-white" href="../manual/ManualUsuario.pdf" target="_blank">
    <i class="bi bi-question-circle"></i> Ayuda
  </a>
</li>
                        <li class="nav-item dropdown">
                            <a class="nav-link text-white" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                              <i class="bi bi-person-circle fs-3 text-white ms-1 me-3"></i>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                              <li><a class="dropdown-item" href="../login.html">Cerrar Sesión</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="mb-5">

        <div class="d-flex justify-content-between align-items-center" style="padding-right: 50px !important;">
            <h1 class="mt-1 mb-3 ms-5">Registro de prestamos</h1>
            <div class="d-flex gap-2">
                <button class="btn acp text-white ms-2" style="height: 38px; margin-left: 50px;">
                    <a class="text-white sin-estilo" href="../Interfaces del admin/Agregar_registro.html">Agregar</a>
                </button>

                <button type="button" class="btn acp text-white ms-2 d-flex gap-2" style="height: 38px;" data-bs-toggle="modal"
                    data-bs-target="#exampleModal">
                    <i class="bi bi-bell"></i>
                    Notificaciones
                </button>
            </div>
        </div>

        <div class="container-fluid ms-4 mb-4"  style="padding-right: 6% !important;">
            <div class="search-container d-flex align-items-center justify-content-between">
                <form class="d-flex" style="min-width: 500px;" id="formSearch">
                    <input type="text" class="form-control input-filter" placeholder="Buscar registro" required>
                    <button class="btn acp text-white ms-2" type="submit" style="height: 100%;">
                        <i class="bi bi-search"></i>
                    </button>
                </form>

                <div class="filtros-container ms-3 d-flex">
                    <input type="date" class="form-control bg-body-secondary" id="fecha" required>
                    <select id="estado-filter" class="form-select bg-body-secondary ms-2"
                        aria-label="Filtrar por estado">
                        <option value="">Todos los Estados</option>
                        <option value="Aprobado">Aprobado</option>
                        <option value="Rechazado">Rechazado</option>
                        <option value="Activo">Activo</option>
                        <option value="Vencido">Vencido</option>
                        <option value="Devuelto">Devuelto</option>
                    </select>

                    <button class="btn acp text-white ms-2 btn-fil"  style="height: 38px;">
                        <i class="bi bi-funnel"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Solicitudes de Préstamo</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="solicitudes-container" class="d-flex flex-wrap justify-content-center gap-3">
                            <p class="text-center">Cargando solicitudes...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="table-responsive ms-5 me-5 rounded">
            <div class="rounded shadow">
                <table class="table mb-0 table-secondary text-center align-middle">
                    <thead>
                        <tr>
                            <th scope="col">Id</th>
                            <th scope="col">Ref. Libro</th>
                            <th scope="col">Titulo</th>
                            <th scope="col">Fecha_Prestamo</th>
                            <th scope="col">Fecha_Devolucion</th>
                            <th scope="col">Nombre Est.</th>
                            <th scope="col">Estado</th>
                        </tr>
                    </thead>
                    <tbody class="table-light" id="prestamos-body">
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="../js/prestamosadmin.js"></script>
</body>

</html>

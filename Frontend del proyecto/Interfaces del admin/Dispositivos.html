<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Dispositivos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/estilo.css">
    <style>
        .navbar { background-color: #1e2640; }
        body { overflow-x: hidden; }
        main { margin-top: 80px; padding: 20px; }
        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .table th, .table td { white-space: nowrap; vertical-align: middle; }
        .badge { font-size: 0.85em; }
    </style>
</head>

<body class="bg-light">
    <header>
        <nav class="navbar navbar-expand-lg shadow fixed-top" style="background-color: #1e2640;">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="../Img/IUB logo 2.png" alt="Logo" height="40">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link text-white" href="../Interfaces del admin/Inicio.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="../Interfaces del admin/Registro_Usuario.html">Registros</a></li>
                        <li class="nav-item"><a class="nav-link text-white active" href="../Interfaces del admin/Dispositivos.html">Préstamo de dispositivos</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="../Interfaces del admin/Ingreso_Usuarios.html">Ingreso de usuarios</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="../Interfaces del admin/agregar_estudiante.html">Agregar Usuario</a></li>
                        <!-- ✅ MEJORA: enlace al Dashboard -->
                        <li class="nav-item"><a class="nav-link text-white" href="../Interfaces del admin/estadisticas.html"><i class="bi bi-bar-chart-fill"></i> Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="../manual/ManualUsuario.pdf" target="_blank"><i class="bi bi-question-circle"></i> Ayuda</a></li>
                        <li class="nav-item dropdown">
                            <a class="nav-link text-white" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-person-circle fs-3 text-white ms-1 me-3"></i>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="#" onclick="cerrarSesion()">Cerrar Sesión</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <h1 class="mt-1 mb-4 ms-3">Gestión de Dispositivos y Préstamos</h1>

        <!-- Tabs -->
        <ul class="nav nav-tabs ms-3 mb-4" id="mainTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="dispositivos-tab" data-bs-toggle="tab" data-bs-target="#dispositivos" type="button" role="tab">
                    <i class="bi bi-laptop me-1"></i> Dispositivos
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="prestamos-tab" data-bs-toggle="tab" data-bs-target="#prestamos" type="button" role="tab">
                    <i class="bi bi-arrow-left-right me-1"></i> Préstamos Activos
                </button>
            </li>
        </ul>

        <div class="tab-content">

            <!-- Tab Dispositivos -->
            <div class="tab-pane fade show active" id="dispositivos" role="tabpanel">

                <!-- ✅ MEJORA: buscador de dispositivos -->
                <div class="ms-3 me-3 mb-3 d-flex gap-2 flex-wrap align-items-center">
                    <input type="text"
                           id="buscadorDispositivos"
                           class="form-control"
                           style="max-width:400px"
                           placeholder="🔍 Buscar dispositivo..."
                           data-tabla="dispositivos-body">

                    <!-- ✅ MEJORA: exportar préstamos a PDF/Excel -->
                    <button onclick="exportarPrestamos(currentPrestamos, 'excel')" class="btn btn-success btn-sm ms-auto">
                        <i class="bi bi-file-earmark-excel"></i> Excel Préstamos
                    </button>
                    <button onclick="exportarPrestamos(currentPrestamos, 'pdf')" class="btn btn-danger btn-sm">
                        <i class="bi bi-file-earmark-pdf"></i> PDF Préstamos
                    </button>
                </div>

                <div class="table-responsive ms-3 me-3 rounded shadow">
                    <table class="table mb-0 table-secondary text-center align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tipo</th>
                                <th>Marca</th>
                                <th>Modelo</th>
                                <th>Sede</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="table-light" id="dispositivos-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- Tab Préstamos -->
            <div class="tab-pane fade" id="prestamos" role="tabpanel">

                <!-- ✅ MEJORA: buscador de préstamos -->
                <div class="ms-3 me-3 mb-3">
                    <input type="text"
                           id="buscadorPrestamos"
                           class="form-control"
                           style="max-width:400px"
                           placeholder="🔍 Buscar préstamo..."
                           data-tabla="prestamos-body">
                </div>

                <div class="table-responsive ms-3 me-3 rounded shadow">
                    <table class="table mb-0 table-secondary text-center align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Dispositivo</th>
                                <th>Sede</th>
                                <th>Fecha Préstamo</th>
                                <th>Fecha Devolución</th>
                                <th>Usuario</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="table-light" id="prestamos-body"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!-- ✅ MEJORAS: librerías para PDF y Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- ✅ MEJORAS: scripts de sesión, confirmación, buscador y reportes -->
    <script src="../js/sesion.js"></script>
    <script src="../js/confirmacion.js"></script>
    <script src="../js/buscador.js"></script>
    <script src="../js/reportes.js"></script>
    <script src="../js/Dispositivos.js"></script>
</body>

</html>

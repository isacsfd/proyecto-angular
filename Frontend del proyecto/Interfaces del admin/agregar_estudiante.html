    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/estilo.css">

        --bs-gutter-x:0;
      }
      .form-container {
        max-width: 600px;
        margin: 0 auto;
      }
      .error-message {
        color: red;
        font-size: 0.8rem;
        margin-top: 0.25rem;
      }
      .form-label {
        font-weight: 500;
      }
    </style>
</head>
<body class="bg-light">

    <header>
        <nav class="navbar navbar-expand-lg shadow fixed-top">
            <div class="container-fluid">
              <a class="navbar-brand" href="#">
                <img src="../img/IUB logo 2.png" alt="Logo" height="40">
              </a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                    <a class="nav-link text-white" href="../Interfaces del admin/Inicio.html">Inicio</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link text-white" href="../Interfaces del admin/Registro_Usuario.html">Registros</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link text-white" href="../Interfaces del admin/Dispositivos.html">Préstamo de dispositivos</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link text-white" href="../Interfaces del admin/Ingreso_Usuarios.html">Ingreso de usuarios</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link text-white" href="../Interfaces del admin/agregar_estudiante.html">Agregar Usuario</a>
                  </li>
                  <li class="nav-item">
  <a class="nav-link text-white" href="../manual/ManualUsuario.pdf" target="_blank">
    <i class="bi bi-question-circle"></i> Ayuda
  </a>
</li>
                  <li class="nav-item dropdown">
                    <a class="nav-link text-white" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                      <i class="bi bi-person-circle fs-3 text-white ms-1 me-3"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                      <li><a class="dropdown-item" href="../login.html">Cerrar Sesión</a></li>
                    </ul>
                  </li>
                </ul>
              </div>
            </div>
          </nav>
    </header>

    <main class="mt-5 pt-4">
      <div class="container">
          <div class="form-container bg-white shadow rounded-3 p-4">
              <h1 class="text-center mb-4">Agregar Nuevo Usuario</h1>
              
              <form id="userForm">
                  <div class="mb-3">
                      <label for="nombre" class="form-label">Nombre Completo*</label>
                      <input type="text" class="form-control" id="nombre" required>
                      <div class="error-message" id="nombre-error"></div>
                  </div>

                  <div class="mb-3">
                      <label for="username" class="form-label">Username*</label>
                      <input type="text" class="form-control" id="username" required>
                      <div class="error-message" id="username-error"></div>
                  </div>

                  <div class="mb-3">
                      <label for="identificacion" class="form-label">Número de Identificación*</label>
                      <input type="text" class="form-control" id="identificacion" required>
                      <div class="error-message" id="identificacion-error"></div>
                  </div>

                  <div class="mb-3">
                      <label for="email" class="form-label">Email*</label>
                      <input type="email" class="form-control" id="email" required>
                      <div class="error-message" id="email-error"></div>
                  </div>

                  <div class="mb-3">
                      <label for="phone" class="form-label">Teléfono</label>
                      <input type="text" class="form-control" id="phone">
                  </div>

                  <div class="mb-3">
                      <label for="address" class="form-label">Dirección</label>
                      <input type="text" class="form-control" id="address">
                  </div>

                  <div class="mb-3">
                      <label for="nivel_academico" class="form-label">Nivel Académico</label>
                      <input type="text" class="form-control" id="nivel_academico">
                  </div>

                  <div class="mb-3">
                      <label for="carrera" class="form-label">Programa Académico/Carrera</label>
                      <input type="text" class="form-control" id="carrera">
                  </div>

                  <div class="mb-3">
                      <label for="rol" class="form-label">Tipo de Usuario*</label>
                      <select class="form-select" id="rol" required>
                          <option value="">Seleccione...</option>
                          <option value="Administrador">Administrador</option>
                          <option value="Estudiante">Estudiante</option>
                          <option value="Funcionario">Funcionario</option>
                          <option value="Docente">Docente</option>
                      </select>
                      <div class="error-message" id="rol-error"></div>
                  </div>

                  <div class="mb-4">
                      <label for="password" class="form-label">Contraseña*</label>
                      <input type="password" class="form-control" id="password" required>
                      <div class="error-message" id="password-error"></div>
                  </div>

                  <div class="d-flex justify-content-between">
                      <button type="button" class="btn btn-secondary" onclick="window.location.href='Registro_Usuario.html'">
                          Cancelar
                      </button>
                      <button type="submit" class="btn btn-primary">
                          <i class="bi bi-person-plus"></i> Agregar Usuario
                      </button>
                  </div>
              </form>
          </div>
      </div>
  </main>

    <script src="../js/Agregar_Estudiante.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>

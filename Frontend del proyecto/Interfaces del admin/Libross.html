<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libros registrados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="../css/estilopropio.css">
    <link rel="stylesheet" href="../css/Inicio.css">
    <style>
        .navbar {
            background-color: #1e2640;
        }

        .acp {
            background-color: #1e2640;
        }

        .table-custom {
            background-color: white;
        }

        .table-custom thead {
            background-color: #e9ecef;
        }

        .table-custom th,
        .table-custom td {
            vertical-align: middle;
            text-align: center !important;
            padding: 12px 8px;
        }

        .table-custom thead th {
            text-align: center !important;
        }

        main {
            margin-top: 80px;
        }

        .filtros-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-filtro {
            background-color: #e9ecef;
            border: 1px solid #ced4da;
            color: #495057;
            padding: 6px 12px;
            font-size: 14px;
        }

        .btn-filtro:hover {
            background-color: #d1d7dc;
        }

        .search-container {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .dropdown-menu {
            max-height: 300px;
            overflow-y: auto;
        }

        .dropdown-item-checkbox {
            padding: 0.25rem 1.5rem;
        }

        .dropdown-item-checkbox label {
            cursor: pointer;
            width: 100%;
            padding: 0.25rem 0;
            margin: 0;
        }

        body {
            overflow-x: hidden;
        }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .table {
            width: 100%;
            max-width: 100%;
            margin-bottom: 1rem;
            table-layout: auto;
        }

        .table th,
        .table td {
            white-space: nowrap;
            text-align: center !important;
        }

        .sin-estilo {
            text-decoration: none;
        }

        .title-cell {
            white-space: normal;
            word-break: break-word;
            max-width: 200px;
            text-align: center !important;
        }

        .pagination-container {
            overflow-x: auto;
            width: 100%;
        }

        .pagination {
            flex-wrap: nowrap;
            overflow-x: auto;
            white-space: nowrap;
            display: inline-block;
        }

        @media (max-width: 1200px) {

            .table th,
            .table td {
                padding: 8px 5px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 992px) {

            .table th,
            .table td {
                padding: 6px 4px;
                font-size: 0.85rem;
            }
        }

        .pagination-container {
            overflow-x: auto;
            width: 100%;
        }

        .pagination {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            white-space: nowrap;
            width: max-content;
            margin: 0 auto;
        }

        .page-item {
            display: inline-block;
            margin: 0 2px;
        }

        .page-link {
            min-width: 38px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .pagination {
                width: 100%;
            }
        }
    </style>
</head>

<body class="bg-light">
    <header>
        <nav class="navbar navbar-expand-lg shadow fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="../Img/IUB logo 2.png" alt="Logo" height="40">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link text-white"
                                href="../Interfaces del admin/Inicio.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link text-white"
                                href="../Interfaces del admin/Libross.html">Libros</a></li>
                        <li class="nav-item"><a class="nav-link text-white"
                                href="../Interfaces del admin/Registro_Usuario.html">Registros</a>
                        </li>
                        <li class="nav-item"><a class="nav-link text-white"
                                href="../Interfaces del admin/Dispositivos.html">Préstamo de dispositivos</a></li>
                        <li class="nav-item"><a class="nav-link text-white"
                                href="../Interfaces del admin/Ingreso_Usuarios.html">Ingreso de
                                usuarios</a></li>
                        <li class="nav-item">
                            <a class="nav-link text-white"
                                href="../Interfaces del admin/agregar_estudiante.html">Agregar Usuario</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="../manual/ManualUsuario.pdf" target="_blank">
                                <i class="bi bi-question-circle"></i> Ayuda
                            </a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link text-white" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                <i class="bi bi-person-circle fs-3 text-white ms-1 me-3"></i>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="../login.html">Cerrar
                                        Sesión</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="mb-5">

        <div class="container-fluid mb-4">
            <h1 class="mt-1 mb-3">Libros registrados</h1>
            <div class="search-container mb-3">
                <form class="d-flex" style="min-width: 500px;">
                    <input type="text" class="form-control" placeholder="Buscar registro" required>
                    <button class="btn acp text-white ms-2" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
                <div class="filtros-container">
                    <div class="form-group">
                        <select id="autores" class="form-select bg-body-secondary">
                            <option value="">Autores</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <select id="anio" class="form-select bg-body-secondary">
                            <option value="">Año</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <select id="virtual" class="form-select bg-body-secondary">
                            <option value="">Virtual</option>
                            <option value="si">Sí</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                    <button id="filterBtn" class="btn acp text-white ms-2" style="height: 38px;">
                        <i class="bi bi-funnel"></i>
                    </button>
                    <button class="btn acp text-white ms-2" style="height: 38px;">
                        <a class="text-white sin-estilo" href="../Interfaces del admin/agregar_libro.html">Agregar</a>
                    </button>
                </div>
            </div>
            <div class="table-responsive rounded">
                <div class="rounded shadow">
                    <table class="table mb-0 table-custom table-secondary text-center align-middle">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Titulo</th>
                                <th scope="col">Autor</th>
                                <th scope="col">Ejemplar</th>
                                <th scope="col">Año</th>
                                <th scope="col">Idioma</th>
                                <th scope="col">Virtual</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="table-light">
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="pagination-container mt-3">
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-center">
                        <!-- Pagination will be added here by JavaScript -->
                    </ul>
                </nav>
            </div>
        </div>
    </main>

    <!-- Modal de Edición -->
    <div class="modal fade" id="editBookModal" tabindex="-1" aria-labelledby="editBookModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="editBookModalLabel">Editar Libro</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editBookForm">
                        <input type="hidden" id="editBookId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="editAutor" class="form-label">Autor*</label>
                                <input type="text" class="form-control" id="editAutor" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="editTitulo" class="form-label">Título*</label>
                                <input type="text" class="form-control" id="editTitulo" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="editPrograma" class="form-label">Programa*</label>
                                <input type="text" class="form-control" id="editPrograma" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="editItem" class="form-label">Item*</label>
                                <input type="number" class="form-control" id="editItem" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="editSignatura" class="form-label">Signatura*</label>
                                <input type="text" class="form-control" id="editSignatura" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="editAreas" class="form-label">Áreas*</label>
                                <input type="number" class="form-control" id="editAreas" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="editEjemplar" class="form-label">Ejemplar*</label>
                                <input type="number" class="form-control" id="editEjemplar" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="editEditorial" class="form-label">Editorial*</label>
                                <input type="text" class="form-control" id="editEditorial" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="editAnio" class="form-label">Año*</label>
                                <input type="number" class="form-control" id="editAnio" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="editIdioma" class="form-label">Idioma*</label>
                                <input type="text" class="form-control" id="editIdioma" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="editObservaciones" class="form-label">Observaciones</label>
                            <input type="text" class="form-control" id="editObservaciones">
                        </div>
                        <div class="mb-3">
                            <label for="editPrecio" class="form-label">Precio</label>
                            <input type="text" class="form-control" id="editPrecio">
                        </div>
                        <div class="mb-3">
                            <label for="editProveedor" class="form-label">Proveedor</label>
                            <input type="text" class="form-control" id="editProveedor">
                        </div>
                        <div class="mb-3">
                            <label for="editRegistroLinea" class="form-label">Registro en línea</label>
                            <select class="form-select" id="editRegistroLinea">
                                <option value="">Seleccione...</option>
                                <option value="si">Sí</option>
                                <option value="no">No</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="saveEditBtn">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/libros.js"></script>
</body>

</html>

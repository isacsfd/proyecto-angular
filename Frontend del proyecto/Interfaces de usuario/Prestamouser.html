<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prestamos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="../css/Inicio.css">

</head>
<body class="bg-light">
    <header>
        <nav class="navbar navbar-expand-md navbar-expand-lg shadow fixed-top">
            <div class="container-fluid">
              <a class="navbar-brand" href="#">
                <img src="../img/IUB logo 2.png" alt="Logo" height="40">
              </a>
              <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                  <li class="nav-item">
                    <a class="nav-link text-white" href="../Interfaces de usuario/Inicio.html">Inicio</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link text-white" href="../Interfaces de usuario/libros.html">Libros</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link text-white" href="../Interfaces de usuario/Prestamouser.html">Prestamos</a>
                  </li>
                  <li class="nav-item dropdown">
                    <a class="nav-link text-white" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                      <i class="bi bi-person-circle fs-3 text-white ms-1 me-3"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                      <li><a class="dropdown-item" href="../login.html">Cerrar Sesión</a></li>
                    </ul>
                  </li>
                </ul>
              </div>
            </div>
          </nav>
    </header>

    <main>
      <div class="mt-5">
        <h6 class="mt-5 mb-3 ms-5">Ingrese el nombre del libro que desea prestar</h6>
      </div>
      
      
      <div class="container-fluid col-md-4 ms-4 mb-5">
        <form class="d-flex" id="form-buscar-libro">
            <input type="text" class="form-control ms-3 me-2" id="input-buscar-libro" placeholder="Buscar por título exacto" required>
            <button class="btn acp" type="submit"><i class="bi bi-search text-white"></i></button>
        </form>
    </div>

      <div class="container mt-3" id="resultados-busqueda" style="display: none;">
        <div class="card shadow-sm">
            <div class="card-header bg-light">
                <h5 class="mb-0">Resultados de búsqueda</h5>
            </div>
            <div class="card-body" id="lista-libros">
                
            </div>
        </div>
      </div>
      
      <div class="container mt-5 pt-4">
        <div class="row">
            <div class="col-12 col-md-8 col-lg-6 cont-libro-seleccionado">
                <div class="card mb-4 shadow-sm">
                    <div class="card-header acp text-white">
                        <h5 class="mb-0">Libro seleccionado</h5>
                    </div>
                    <div class="card-body">
                      <div class="row">
                          <div class="col-md-4 text-center">
                              <i class="bi bi-book fs-1"></i>
                          </div>
                          <div class="col-md-8">
                              <h3 id="libro-titulo" class="h4">Cargando título...</h3>
                              <p id="libro-autor" class="text-muted mb-2">Cargando autor...</p>
                              <button id="btn-prestar" class="btn acp w-100 text-white">
                                  Prestar
                              </button>
                          </div>
                      </div>
                  </div>
                </div>
            </div>
    
            
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="mb-0">Tus préstamos activos</h5>
                    </div>
                    <div class="card-body" id="prestamos-pendientes">
                        <div class="text-center py-4">
                            <i class="bi bi-clock-history fs-1 text-muted"></i>
                            <p class="mt-2">Cargando tus préstamos...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../js/prestamouser.js"></script>
</body>
</html>

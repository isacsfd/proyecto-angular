# Netlify — Biblioteca IUB (frontend Angular)
# Compila el frontend monorepo (carpeta Frontend-Angular) en producción.
[build]
  base = "Frontend-Angular"
  command = "npm ci && npm run build:netlify"
  publish = "dist/Frontend-Angular/browser"

[build.environment]
  NODE_VERSION = "24"

# SPA Angular: cualquier ruta recargada se sirve por index.html (sin 404).
# Recorte: los bundles se agrupan en /js y /css (script post-build
# herramientas/organizar-assets.js) para poder aplicar 404 por prefijo: el
# splat "/*.js" NO es un patrón válido en Netlify (el asterisco solo se
# acepta al final del segmento). Los assets existentes se sirven antes que
# cualquier regla; las rutas de Angular conservan el fallback.
[[redirects]]
  from = "/js/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/css/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

<div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Gestión de Libros</h2>
  <div class="d-flex align-items-center gap-2">
    @if (esSuper()) {
      <select class="form-select form-select-sm w-auto" [(ngModel)]="sedeFiltro" (change)="cambiarSede()">
        <option value="">Todas las sedes</option>
        @for (s of sedes; track s.clave) { <option [value]="s.clave">{{ s.nombre }}</option> }
      </select>
    } @else {
      <span class="badge text-bg-primary">{{ sedeAdmin() }}</span>
    }
    <button class="btn btn-iub text-white" (click)="abrirNuevo()"><i class="bi bi-plus-lg me-1"></i>Nuevo libro</button>
  </div>
</div>

@if (error()) {
  <app-alerta [mensaje]="error()" tipo="danger" (cerrar)="error.set('')"></app-alerta>
}

<div class="card border-0 shadow-sm">
  <div class="card-header bg-white fw-semibold d-flex flex-wrap justify-content-between align-items-center gap-2">
    <span>Catálogo de libros</span>
    <div class="btn-group">
      <button class="btn btn-sm btn-outline-danger" (click)="exportarPDF()"><i class="bi bi-file-earmark-pdf me-1"></i>PDF</button>
      <button class="btn btn-sm btn-outline-success" (click)="exportarExcel()"><i class="bi bi-file-earmark-excel me-1"></i>Excel</button>
    </div>
  </div>
  <div class="card-body">
    <app-paginador-ngx
      [count]="filasLibros().length"
      [offset]="offset()"
      [limit]="limite()"
      (offsetChange)="offset.set($event)"
      (limitChange)="limite.set($event)"
    >
      <div class="input-group input-group-sm" style="max-width: 260px;">
        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
        <input class="form-control" type="search" placeholder="Buscar en la tabla..." [(ngModel)]="filtro" aria-label="Buscar en la tabla">
      </div>
    </app-paginador-ngx>

    @if (cargando()) {
      <div class="text-center py-4"><div class="spinner-border text-primary"></div></div>
    } @else {
      @if (filasLibros().length === 0) {
        <div class="text-center text-muted py-4">No hay libros que coincidan con la búsqueda.</div>
      } @else {
        <ngx-datatable
          class="material"
          [rows]="filasPagina()"
          [columnMode]="'force'"
          [headerHeight]="40"
          [footerHeight]="0"
          [rowHeight]="'auto'"
          [offset]="0"
          [limit]="limite()"
        >
          <ngx-datatable-column name="ID" prop="ID"></ngx-datatable-column>
          <ngx-datatable-column name="Título" prop="Titulo"></ngx-datatable-column>
          <ngx-datatable-column name="Autor" prop="Autor"></ngx-datatable-column>
          <ngx-datatable-column name="Programa" prop="Programa"></ngx-datatable-column>
          <ngx-datatable-column name="Sede" prop="sede"></ngx-datatable-column>
          <ngx-datatable-column name="Ejemplares" prop="Ejemplar"></ngx-datatable-column>
          <ngx-datatable-column name="Año" prop="Año"></ngx-datatable-column>
          <ngx-datatable-column name="Acciones" [sortable]="false" [flexGrow]="1">
            <ng-template let-row="row">
              <button class="btn btn-sm btn-outline-primary me-1" aria-label="Editar libro" (click)="abrirEditar(row)"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-outline-danger" aria-label="Eliminar libro" (click)="eliminar(row)"><i class="bi bi-trash"></i></button>
            </ng-template>
          </ngx-datatable-column>
        </ngx-datatable>
      }
    }
  </div>
</div>

@if (mostrarModal()) {
  <app-libro-modal
    [libro]="libroModal()"
    [sedes]="sedes"
    [sedePorDefecto]="sedeLibroNuevo()"
    [guardando]="guardandoModal()"
    (guardar)="onGuardarLibro($event)"
    (cerrar)="cerrarModal()"
  ></app-libro-modal>
}

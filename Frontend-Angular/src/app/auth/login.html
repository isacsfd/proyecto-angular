<div class="login-bg d-flex align-items-center justify-content-center">
  <div class="card border-0 shadow rounded-4 p-4 p-md-5" style="width: 100%; max-width: 440px;">
    <div class="text-center mb-4">
      <img src="/logo-iub.png" alt="Logo IUB" width="120" onerror="this.style.display='none'">
      <h1 class="fs-4 fw-semibold text-iub mt-3 mb-0">Biblioteca IUB</h1>
      <p class="text-muted mb-0">Inicie sesión con su número de identificación</p>
    </div>

    <form (ngSubmit)="aceptar()">
      <div class="mb-3">
        <label class="form-label fw-semibold">NÚMERO DE IDENTIFICACIÓN</label>
        <input
          type="text"
          class="form-control bg-body-secondary"
          [(ngModel)]="identificacion"
          name="identificacion"
          placeholder="Ej: 1234567890"
          autofocus
        >
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">CONTRASEÑA</label>
        <input
          type="password"
          class="form-control bg-body-secondary"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
        >
      </div>

      @if (mensaje()) {
        <div class="alert alert-{{ tipoMensaje() }} alert-dismissible fade show" role="alert">
          {{ mensaje() }}
        </div>
      }

      <div class="d-flex gap-2 justify-content-center">
        <button type="button" class="btn btn-outline-secondary px-4" (click)="identificacion=''; password=''">
          CANCELAR
        </button>
        <button type="submit" class="btn btn-iub px-4 text-white" [disabled]="cargando()">
          @if (cargando()) {
            <span class="spinner-border spinner-border-sm" role="status"></span> Cargando...
          } @else {
            ACEPTAR
          }
        </button>
      </div>
    </form>
  </div>
</div>

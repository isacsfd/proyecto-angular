<div class="position-relative seleccion-libro">
  <div class="input-group">
    <span class="input-group-text"><i class="bi bi-search"></i></span>
    <input
      class="form-control"
      type="search"
      [placeholder]="placeholder"
      [(ngModel)]="texto"
      (input)="alEscribir()"
      (focus)="onFocus()"
      (keydown)="onKeydown($event)"
      autocomplete="off"
    >
    @if (cargando()) {
      <span class="input-group-text"><span class="spinner-border spinner-border-sm"></span></span>
    }
  </div>

  @if (abierto()) {
    <div class="seleccion-menu">
      @if (cargando() && sugerencias().length === 0) {
        <div class="seleccion-mensaje">Buscando...</div>
      } @else if (sugerencias().length > 0) {
        @for (s of sugerencias(); track s.id; let i = $index) {
          <button
            type="button"
            class="seleccion-item"
            [class.activa]="i === indice()"
            (mousedown)="seleccionar(s)"
            (mouseenter)="indice.set(i)"
          >
            <span class="flex-grow-1">
              <span class="d-block text-truncate fw-semibold">{{ s.titulo }}</span>
              <small class="text-muted d-block text-truncate">{{ s.autor }}</small>
              <small class="d-block text-truncate text-iub">Sede: {{ s.sede ?? '—' }}</small>
            </span>
            <span class="badge text-bg-success ms-2" [title]="s.ejemplares + ' ejemplar(es) disponible(s)'">{{ s.ejemplares }}</span>
          </button>
        }
      } @else if (texto.trim().length >= 2) {
        <div class="seleccion-mensaje">No se encontraron libros</div>
      }
    </div>
  }
</div>

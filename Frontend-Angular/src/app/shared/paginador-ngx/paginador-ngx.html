<div class="d-flex flex-wrap gap-2 align-items-center justify-content-between py-2">
  <div class="d-flex flex-wrap align-items-center gap-2">
    <label class="small text-muted mb-0">Mostrar</label>
    <select class="form-select form-select-sm" style="width: auto" [(ngModel)]="limit" (ngModelChange)="cambiarLimite()" aria-label="Registros por página">
      @for (o of opciones; track o) {
        <option [ngValue]="o">{{ o }}</option>
      }
    </select>
    @if (count > 0) {
      <span class="small text-muted">{{ inicio }}–{{ fin }} de {{ count }}</span>
    } @else {
      <span class="small text-muted">0 registros</span>
    }
    <div class="btn-group btn-group-sm">
      <button type="button" class="btn btn-outline-secondary" [disabled]="offset === 0" (click)="anterior()" aria-label="Anterior">
        <i class="bi bi-chevron-left"></i>
      </button>
      @for (p of paginas(); track p) {
        <button type="button" class="btn btn-outline-secondary" [class.active]="p === paginaActual" (click)="irPagina(p)">{{ p }}</button>
      }
      <button type="button" class="btn btn-outline-secondary" [disabled]="paginaActual >= totalPaginas" (click)="siguiente()" aria-label="Siguiente">
        <i class="bi bi-chevron-right"></i>
      </button>
    </div>
  </div>
  <div class="d-flex align-items-center">
    <ng-content></ng-content>
  </div>
</div>
